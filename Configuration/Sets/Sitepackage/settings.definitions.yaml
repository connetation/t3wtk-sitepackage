categories:
  email:
    label: 'Email'

settings:
  # These three settings are OWNED by typo3/email (see the "typo3/email" Set
  # dependency in config.yaml); re-declared here only to point their default
  # at this package's own Templates/Layouts/Partials/Email folders, so any
  # project built on conn/sitepackage gets EXT:form's email finishers (and
  # any other FluidEmail, e.g. felogin) branded and working out of the box —
  # no manual config/sites/*/settings.yaml wiring needed, unlike a plain
  # per-project sitepackage copy would require.
  # type/enum MUST stay identical to the originals in
  # typo3/cms-core's Configuration/Sets/Email/settings.definitions.yaml.
  email.templateRootPaths:
    label: 'Email template root paths'
    type: stringlist
    default: ['EXT:conn_sitepackage/Resources/Private/Templates/Email/']
    category: email

  email.layoutRootPaths:
    label: 'Email layout root paths'
    type: stringlist
    default: ['EXT:conn_sitepackage/Resources/Private/Layouts/Email/']
    category: email

  email.partialRootPaths:
    label: 'Email partial root paths'
    type: stringlist
    default: ['EXT:conn_sitepackage/Resources/Private/Partials/Email/']
    category: email
