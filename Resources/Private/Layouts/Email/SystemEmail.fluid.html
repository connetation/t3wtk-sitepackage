<!doctype html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:v="urn:schemas-microsoft-com:vml"
    xmlns:o="urn:schemas-microsoft-com:office:office"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
    xmlns:conn="http://typo3.org/ns/Connetation/T3kitBase/ViewHelpers"
>
<head>
    <!--[if gte mso 15]>
    <xml>
        <o:OfficeDocumentSettings>
            <o:AllowPNG/>
            <o:PixelsPerInch>96</o:PixelsPerInch>
        </o:OfficeDocumentSettings>
    </xml>
    <![endif]-->
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light dark">
    <title></title>
    <style type="text/css">
        p {
            margin:10px 0;
            padding:0;
        }
        table {
            border-collapse:collapse;
        }
        h1,
        h2,
        h3,
        h4,
        h5,
        h6 {
            display:block;
            margin:0;
            padding:0;
        }
        img,
        a img {
            border:0;
            height:auto;
            outline:none;
            text-decoration:none;
        }
        body,
        #bodyTable,
        #bodyCell {
            height:100%;
            margin:0;
            padding:0;
            width:100%;
        }
        #outlook a {
            padding:0;
        }
        img {
            -ms-interpolation-mode:bicubic;
        }
        table {
            mso-table-lspace:0pt;
            mso-table-rspace:0pt;
        }
        .ReadMsgBody {
            width:100%;
        }
        .ExternalClass {
            width:100%;
        }
        p,
        a,
        td {
            mso-line-height-rule:exactly;
        }
        a[href^=tel],
        a[href^=sms] {
            color:inherit;
            cursor:default;
            text-decoration:none;
        }
        p,
        a,
        td,
        body,
        table,
        blockquote {
            -ms-text-size-adjust:100%;
            -webkit-text-size-adjust:100%;
        }
        .ExternalClass,
        .ExternalClass p,
        .ExternalClass td,
        .ExternalClass div,
        .ExternalClass span,
        .ExternalClass font {
            line-height:100%;
        }
        a[x-apple-data-detectors]{
            color:inherit !important;
            text-decoration:none !important;
            font-size:inherit !important;
            font-family:inherit !important;
            font-weight:inherit !important;
            line-height:inherit !important;
        }

        .templateContainer {
            max-width:600px !important;
        }
        a.button {
            display:block;
        }
        .image,.retinaImage {
            vertical-align:bottom;
        }
        .textContent {
            word-break:break-word;
        }
        .textContent img {
            height:auto !important;
        }
        .dividerBlock {
            table-layout:fixed !important;
        }
        h1 {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:40px;
            font-style:normal;
            font-weight:bold;
            line-height:150%;
            letter-spacing:normal;
            text-align:center;
        }
        h2 {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:34px;
            font-style:normal;
            font-weight:bold;
            line-height:150%;
            letter-spacing:normal;
            text-align:left;
        }
        h3 {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:22px;
            font-style:normal;
            font-weight:bold;
            line-height:150%;
            letter-spacing:normal;
            text-align:left;
        }
        h4 {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:20px;
            font-style:italic;
            font-weight:normal;
            line-height:125%;
            letter-spacing:normal;
            text-align:left;
        }
        #templateHeader {
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:0;
            border-bottom:0;
            padding-top:36px;
            padding-bottom:0;
        }
        .headerContainer {
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:1px none ;
            border-bottom:0;
            padding-top:36px;
            padding-bottom:36px;
        }
        .headerContainer .textContent,
        .headerContainer .textContent p {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:16px;
            line-height:150%;
            text-align:left;
        }
        .headerContainer .textContent a,
        .headerContainer .textContent p a {
            font-weight:normal;
            text-decoration:underline;
        }
        #templateBody {
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:0;
            border-bottom:0;
            padding-top:0;
            padding-bottom:0;
        }
        .bodyContainer {
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:0;
            border-bottom:0;
            padding-top:0;
            padding-bottom:18px;
        }
        .bodyContainer .textContent,
        .bodyContainer .textContent p {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:16px;
            line-height:150%;
            text-align:left;
        }
        .bodyContainer .textContent a,
        .bodyContainer .textContent p a {
            font-weight:normal;
            text-decoration:underline;
        }
        .bodyContainer table.statistics th,
        .bodyContainer table.statistics td {
            padding: 0 5px;
        }
        .bodyContainer table.statistics th:first-child,
        .bodyContainer table.statistics td:first-child {
            padding-left: 0;
        }
        .bodyContainer table.statistics th:last-child,
        .bodyContainer table.statistics td:last-child {
            padding-right: 0;
        }
        #templateFooter{
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:1px none ;
            border-bottom:0;
            padding-top:0;
            padding-bottom:36px;
        }
        .footerContainer{
            background-image:none;
            background-repeat:no-repeat;
            background-position:center;
            background-size:cover;
            border-top:0;
            border-bottom:0;
            padding-top:45px;
            padding-bottom:45px;
        }
        .footerContainer .textContent,
        .footerContainer .textContent p {
            font-family:'Helvetica Neue', Helvetica, Arial, Verdana, sans-serif;
            font-size:12px;
            line-height:150%;
            text-align:center;
        }
        .footerContainer .textContent a,
        .footerContainer .textContent p a {
            font-weight:normal;
            text-decoration:underline;
        }

        @media only screen and (min-width:600px){
            .headerContainer {
                border-top-left-radius: .25rem;
                border-top-right-radius: .25rem;
            }

            .footerContainer {
                border-bottom-left-radius: .25rem;
                border-bottom-right-radius: .25rem;
            }
        }

        @media only screen and (min-width:768px){
            .templateContainer {
                width:600px !important;
            }
        }

        @media only screen and (max-width: 480px){
            body,
            table,
            td,
            p,
            a {
                -webkit-text-size-adjust:none !important;
            }
            body {
                width:100% !important;
                min-width:100% !important;
            }
            h1 {
                font-size:30px !important;
                line-height:125% !important;
            }
            h2 {
                font-size:26px !important;
                line-height:125% !important;
            }
            h3 {
                font-size:20px !important;
                line-height:150% !important;
            }
            h4 {
                font-size:18px !important;
                line-height:150% !important;
            }
            .headerContainer .textContent,
            .headerContainer .textContent p {
                font-size:16px !important;
                line-height:150% !important;
            }
            .bodyContainer .textContent,
            .bodyContainer .textContent p {
                font-size:16px !important;
                line-height:150% !important;
            }
        }

        #templateBody,
        #templateFooter {
            background-color:#f2f2f2;
        }

        .headerContainer,
        .bodyContainer {
            background-color:#ffffff;
        }

        h1,
        h2,
        h3,
        h4,
        .headerContainer .textContent,
        .bodyContainer .textContent,
        .headerContainer .textContent p,
        .bodyContainer .textContent p {
            color:#1a1a1a;
        }

        .bodyContainer .textContent a,
        .headerContainer .textContent a,
        .bodyContainer .textContent p a,
        .headerContainer .textContent p a {
            color:#1f5aad;
        }

        .footerContainer {
            background-color:#4d4d4d;
        }

        .footerContainer .textContent,
        .footerContainer .textContent p,
        .footerContainer .textContent a,
        .footerContainer .textContent p a {
            color:#ffffff;
        }

        @media (prefers-color-scheme: dark) {
            #templateBody,
            #templateFooter {
                background-color:#121212;
            }

            .headerContainer,
            .bodyContainer {
                background-color:#1a1a1a;
            }

            h1,
            h2,
            h3,
            h4,
            .headerContainer .textContent,
            .bodyContainer .textContent,
            .headerContainer .textContent p,
            .bodyContainer .textContent p {
                color:#d9d9d9;
            }

            .bodyContainer .textContent a,
            .headerContainer .textContent a,
            .bodyContainer .textContent p a,
            .headerContainer .textContent p a {
                color:#7daae8;
            }

            .footerContainer {
                background-color:#141414;
            }
        }
    </style>
</head>
<body>


<center>
    <table align="center" border="0" cellpadding="0" cellspacing="0" height="100%" width="100%" id="bodyTable"><tr><td align="center" valign="top" id="bodyCell">
        <table border="0" cellpadding="0" cellspacing="0" width="100%">

            <!-- Header follows the website header: logo = branding.logo, background =
                 theme.light.navBg, title color = theme.light.navText (site settings).
                 Change them in Site Management → Settings, emails follow automatically.
                 A finisher can still override per email via `variables: {logoUrl: ..., brandColor: ...}`
                 — see conn/t3kit-sitepackage's Resources/Private/Forms/README.md.
                 Fallbacks (settings empty / no request, e.g. CLI mails): white header, site name as text. -->
            <f:variable name="siteSettings" value="{request.attributes.site.settings}" />
            <f:variable name="backgroundColor" value="{f:if(condition: siteSettings.theme.light.navBg, then: siteSettings.theme.light.navBg, else: '#ffffff')}" />
            <f:if condition="{brandColor}">
                <f:variable name="backgroundColor" value="{brandColor}" />
            </f:if>
            <f:variable name="headerTextColor" value="{f:if(condition: siteSettings.theme.light.navText, then: siteSettings.theme.light.navText, else: '#000000')}" />
            <!-- Site name = websiteTitle from the site config (language → site), then $GLOBALS sitename. -->
            <f:variable name="siteName" value="{f:if(condition: request.attributes.site.configuration.websiteTitle, then: request.attributes.site.configuration.websiteTitle, else: typo3.sitename)}" />
            <f:if condition="{request.attributes.language.websiteTitle}">
                <f:variable name="siteName" value="{request.attributes.language.websiteTitle}" />
            </f:if>
            <f:variable name="logoAlt" value="{f:if(condition: siteSettings.branding.logoAlt, then: siteSettings.branding.logoAlt, else: siteName)}" />

            <!-- HEADER START -->
            <tr><td align="center" valign="top" id="templateHeader" style="background-color: {backgroundColor}">

                <!--[if (gte mso 9)|(IE)]><table align="center" border="0" cellspacing="0" cellpadding="0" width="600" style="width:600px;"><tr><td align="center" valign="top" width="600" style="width:600px;"><![endif]-->
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" class="templateContainer"><tr><td valign="top" class="headerContainer" style="background-color: {backgroundColor};">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="textBlock" style="min-width:100%;"><tbody class="textBlockOuter"><tr><td valign="top" class="textBlockInner" style="padding-top:9px;">

                        <!--[if mso]><table align="left" border="0" cellspacing="0" cellpadding="0" width="100%" style="width:100%;"><tr><td valign="top" width="600" style="width:600px;"><![endif]-->
                        <table align="left" border="0" cellpadding="0" cellspacing="0" style="max-width:100%; min-width:100%;" width="100%" class="textContentContainer">
                            <tbody>
                            <tr>
                                <td valign="top" class="image" align="center" style="padding: 0px 36px; padding-bottom: 20px; text-align: center;">
                                    <!-- branding.logo is resolved like the website navbar does (conn:resolvePath from
                                         conn/t3kit-base: EXT:/fileadmin path or URL, '' when an EXT: path doesn't exist,
                                         so a broken setting falls back to the site name instead of failing the mail).
                                         Root-relative results get the sending site's scheme+host prepended, since mail
                                         clients need absolute URLs. A finisher's `logoUrl` variable wins over the setting. -->
                                    <f:variable name="emailLogo" value="" />
                                    <f:if condition="{logoUrl}">
                                        <f:then><f:variable name="emailLogo" value="{logoUrl}" /></f:then>
                                        <f:else if="{siteSettings.branding.logo}">
                                            <f:variable name="resolvedLogo" value="{conn:resolvePath(path: siteSettings.branding.logo)}" />
                                            <f:variable name="logoPrefix" value="{resolvedLogo -> f:format.crop(maxCharacters: 2, append: '', respectWordBoundaries: false, respectHtml: false)}" />
                                            <f:if condition="{logoPrefix} == '//'">
                                                <f:then><f:variable name="emailLogo" value="https:{resolvedLogo}" /></f:then>
                                                <f:else if="{resolvedLogo -> f:format.crop(maxCharacters: 1, append: '', respectWordBoundaries: false, respectHtml: false)} == '/'">
                                                    <f:if condition="{normalizedParams.requestHost}">
                                                        <f:variable name="emailLogo" value="{normalizedParams.requestHost}{resolvedLogo}" />
                                                    </f:if>
                                                </f:else>
                                                <f:else><f:variable name="emailLogo" value="{resolvedLogo}" /></f:else>
                                            </f:if>
                                        </f:else>
                                    </f:if>
                                    <f:if condition="{emailLogo}">
                                        <f:then>
                                            <!-- Height 60 in the attribute (Outlook) AND inline style: the global
                                                 `img { height:auto }` above would otherwise win. Width follows the ratio. -->
                                            <img src="{emailLogo}" alt="{logoAlt}" height="60" style="display:block; margin:0 auto; height:60px; width:auto; max-width:100%;" />
                                        </f:then>
                                        <f:else>
                                            <strong style="font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, Verdana, sans-serif; font-size: 20px; color: {headerTextColor};">{siteName}</strong>
                                        </f:else>
                                    </f:if>
                                </td>
                            </tr>
                            <tr>
                                <td valign="top" class="textContent" style="padding: 0px 36px;font-family: &quot;Helvetica Neue&quot;, Helvetica, Arial, Verdana, sans-serif;font-size: 24px;text-align: center;color: {headerTextColor};">
                                    <strong style="color: {headerTextColor};"><f:render section="Title" optional="true" /></strong>
                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <!--[if mso]></td></tr></table><![endif]-->

                    </td></tr></tbody></table>
                </td></tr></table>
                <!--[if (gte mso 9)|(IE)]></td></tr></table><![endif]-->

            </td></tr>
            <!-- HEADER END -->


            <!-- BODY START -->
            <tr><td align="center" valign="top" id="templateBody">

                <!--[if (gte mso 9)|(IE)]><table align="center" border="0" cellspacing="0" cellpadding="0" width="600" style="width:600px;"><tr><td align="center" valign="top" width="600" style="width:600px;"><![endif]-->
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" class="templateContainer"><tr><td valign="top" class="bodyContainer">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="textBlock" style="min-width:100%;"><tbody class="textBlockOuter"><tr><td valign="top" class="textBlockInner" style="padding: 36px 0px;">

                        <!--[if mso]><table align="left" border="0" cellspacing="0" cellpadding="0" width="100%" style="width:100%;"><tr><td valign="top" width="600" style="width:600px;"><![endif]-->
                        <table align="left" border="0" cellpadding="0" cellspacing="0" style="max-width:100%; min-width:100%;" width="100%" class="textContentContainer">
                            <tbody>
                            <tr>
                                <td valign="top" class="textContent" style="padding: 0px 36px;">

                                    <f:render section="Main" />

                                </td>
                            </tr>
                            </tbody>
                        </table>
                        <!--[if mso]></td></tr></table><![endif]-->

                    </td></tr></tbody></table>
                </td></tr></table>
                <!--[if (gte mso 9)|(IE)]></td></tr></table><![endif]-->

            </td></tr>
            <!-- BODY END -->

            <!-- FOOTER START -->
            <tr><td align="center" valign="top" id="templateFooter">

                <!--[if (gte mso 9)|(IE)]><table align="center" border="0" cellspacing="0" cellpadding="0" width="600" style="width:600px;"><tr><td align="center" valign="top" width="600" style="width:600px;"><![endif]-->
                <table align="center" border="0" cellpadding="0" cellspacing="0" width="100%" class="templateContainer"><tr><td valign="top" class="footerContainer">
                    <table border="0" cellpadding="0" cellspacing="0" width="100%" class="textBlock" style="min-width:100%;"><tbody class="textBlockOuter"><tr><td valign="top" class="textBlockInner">

                        <!--[if mso]><table align="left" border="0" cellspacing="0" cellpadding="0" width="100%" style="width:100%;"><tr><td valign="top" width="600" style="width:600px;"><![endif]-->
                        <table align="left" border="0" cellpadding="0" cellspacing="0" style="max-width:100%; min-width:100%;" width="100%" class="textContentContainer"><tbody><tr><td valign="top" class="textContent" style="padding:0 36px;">

                            <p style="margin-top: 0;">
                                This email was sent automatically by <strong>{siteName}</strong><f:if condition="{normalizedParams.siteUrl}"> (<a href="{normalizedParams.siteUrl}" target="_blank" rel="noopener">{normalizedParams.httpHost}</a>)</f:if>. Please contact us if you feel you received this email by accident.
                            </p>
                            <p style="margin-top: 0;">
                                &copy; <f:format.date date="now" format="Y" /> {siteName}. All rights reserved.
                            </p>

                        </td></tr></tbody></table>
                        <!--[if mso]></td></tr></table><![endif]-->

                    </td></tr></tbody></table>
                </td></tr></table>
                <!--[if (gte mso 9)|(IE)]></td></tr></table><![endif]-->


            </td></tr>
            <!-- FOOTER END -->

        </table>
    </td></tr></table>
</center>

</body>
</html>
